name: tests

# `swift build` and `swift test` are separate steps so a compile failure and a test failure are
# distinguishable at a glance. Blocking: a red here is meant to stop a merge.
#
# Tests that read third-party drawings are gated on PDF_CORPUS and skip here; the PDFs the tests
# write by hand run.
#
# GitHub-hosted macOS runners, as OCCTSwiftIO uses: free for a public repo.

on:
  push:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.*'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.*'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test
